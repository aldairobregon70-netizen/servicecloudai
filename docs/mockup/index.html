<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#020B3A" />
  <title>ServiceCloud AI — IT Service Management</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
  <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
  <style>
    :root{
      --bg:#020B3A;
      --bg2:#06145C;
      --bg3:#0B1E78;
      --primary:#155EEF;
      --primary2:#2F6BFF;
      --blue:#3B82F6;
      --cyan:#5EEBFF;
      --purple:#7C5CFF;
      --white:#FFFFFF;
      --muted:#AFC8FF;
      --text:#EAF2FF;
      --panel:rgba(6,20,92,.72);
      --panel-strong:rgba(4,16,68,.94);
      --line:rgba(110,155,255,.18);
      --line-strong:rgba(94,235,255,.34);
      --success:#34D399;
      --warning:#FBBF24;
      --danger:#FB7185;
      --info:#60A5FA;
      --sidebar:278px;
      --sidebar-mini:84px;
      --header:76px;
      --shadow:0 24px 70px rgba(0,30,120,.25);
      --glow:0 0 0 1px rgba(94,235,255,.08),0 14px 50px rgba(21,94,239,.18);
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{
      margin:0;
      color:var(--text);
      font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      background:
        radial-gradient(circle at 12% 8%,rgba(47,107,255,.20),transparent 22%),
        radial-gradient(circle at 85% 18%,rgba(124,92,255,.14),transparent 25%),
        linear-gradient(145deg,#02072c 0%,var(--bg) 45%,#020829 100%);
      min-height:100vh;
      overflow-x:hidden;
    }
    body::before{
      content:"";
      position:fixed;inset:0;pointer-events:none;z-index:-1;opacity:.45;
      background-image:
        linear-gradient(rgba(75,125,255,.045) 1px,transparent 1px),
        linear-gradient(90deg,rgba(75,125,255,.045) 1px,transparent 1px);
      background-size:44px 44px;
      mask-image:linear-gradient(to bottom,black,transparent 88%);
    }
    button,input,select,textarea{font:inherit}
    button{cursor:pointer}
    a{text-decoration:none;color:inherit}
    .hidden{display:none!important}
    .muted{color:var(--muted)}
    .app-shell{min-height:100vh}
    .sidebar{
      position:fixed;top:0;left:0;bottom:0;width:var(--sidebar);z-index:50;
      padding:18px 14px;
      background:linear-gradient(180deg,rgba(3,14,66,.98),rgba(2,10,50,.96));
      border-right:1px solid var(--line);
      box-shadow:20px 0 60px rgba(0,25,100,.20);
      transition:.28s ease;
      overflow-y:auto;overflow-x:hidden;
      scrollbar-width:thin;
      scrollbar-color:rgba(94,235,255,.22) transparent;
    }
    .sidebar::-webkit-scrollbar{width:5px}
    .sidebar::-webkit-scrollbar-thumb{background:rgba(94,235,255,.22);border-radius:10px}
    .brand{
      height:62px;display:flex;align-items:center;gap:12px;padding:0 10px 14px;
      border-bottom:1px solid var(--line);margin-bottom:14px;white-space:nowrap;
    }
    .brand-mark{
      width:44px;height:44px;border-radius:14px;display:grid;place-items:center;
      background:linear-gradient(145deg,rgba(21,94,239,.42),rgba(94,235,255,.12));
      border:1px solid rgba(94,235,255,.28);
      box-shadow:0 0 28px rgba(47,107,255,.28);flex:0 0 auto;
    }
    .brand-mark i{width:25px;height:25px;color:var(--cyan)}
    .brand-title{font-size:18px;font-weight:800;letter-spacing:-.03em}
    .brand-sub{font-size:10px;color:var(--muted);margin-top:3px}
    .nav-section-label{
      font-size:10px;text-transform:uppercase;letter-spacing:.14em;color:#6f95df;
      padding:10px 13px 8px;
    }
    .nav-item{
      width:100%;display:flex;align-items:center;gap:12px;color:#bfd2ff;
      border:1px solid transparent;background:transparent;border-radius:13px;
      padding:11px 12px;margin:3px 0;text-align:left;transition:.18s ease;position:relative;
      white-space:nowrap;
    }
    .nav-item i{width:18px;height:18px;flex:0 0 auto}
    .nav-item:hover{background:rgba(47,107,255,.11);color:#fff;border-color:rgba(94,235,255,.08)}
    .nav-item.active{
      color:#fff;background:linear-gradient(135deg,rgba(21,94,239,.96),rgba(47,107,255,.76));
      border-color:rgba(94,235,255,.35);
      box-shadow:0 0 28px rgba(21,94,239,.26),inset 0 1px 0 rgba(255,255,255,.10);
    }
    .nav-item.active::after{
      content:"";position:absolute;right:8px;width:5px;height:5px;border-radius:50%;background:var(--cyan);
      box-shadow:0 0 12px var(--cyan);
    }
    .sidebar-footer{
      margin-top:16px;border-top:1px solid var(--line);padding:14px 8px 4px;
    }
    .ai-status{
      border:1px solid rgba(94,235,255,.18);border-radius:14px;
      background:linear-gradient(145deg,rgba(124,92,255,.10),rgba(21,94,239,.10));
      padding:12px;display:flex;gap:10px;align-items:center;
    }
    .ai-dot{width:9px;height:9px;border-radius:50%;background:var(--success);box-shadow:0 0 14px var(--success)}
    .ai-status b{font-size:12px;display:block}.ai-status span{font-size:10px;color:var(--muted)}
    .main-wrap{margin-left:var(--sidebar);min-height:100vh;transition:.28s ease}
    .header{
      height:var(--header);position:sticky;top:0;z-index:40;padding:0 24px;
      display:flex;align-items:center;gap:14px;
      background:rgba(2,11,58,.76);backdrop-filter:blur(18px);
      border-bottom:1px solid var(--line);
    }
    .icon-btn{
      width:42px;height:42px;border-radius:12px;border:1px solid var(--line);
      color:var(--text);background:rgba(15,35,110,.40);display:grid;place-items:center;
      transition:.18s ease;position:relative;
    }
    .icon-btn:hover{border-color:rgba(94,235,255,.38);background:rgba(21,94,239,.18);transform:translateY(-1px)}
    .icon-btn i{width:19px;height:19px}
    .breadcrumb{min-width:190px}
    .breadcrumb .eyebrow{font-size:10px;color:#7ea4ed;text-transform:uppercase;letter-spacing:.12em}
    .breadcrumb strong{display:block;font-size:14px;margin-top:3px}
    .header-spacer{flex:1}
    .search-wrap{position:relative;width:min(390px,34vw)}
    .search-box{
      height:42px;border:1px solid var(--line);border-radius:13px;
      background:rgba(3,15,70,.58);display:flex;align-items:center;padding:0 12px;gap:8px;
      transition:.18s ease;
    }
    .search-box:focus-within{border-color:rgba(94,235,255,.40);box-shadow:0 0 0 3px rgba(94,235,255,.06)}
    .search-box i{width:17px;color:#7fa8f6}
    .search-box input{border:0;outline:0;background:transparent;color:#fff;width:100%;font-size:13px}
    .search-box input::placeholder{color:#7293d3}
    .search-results,.dropdown-panel{
      position:absolute;right:0;top:52px;min-width:320px;max-width:430px;
      background:rgba(3,13,57,.98);border:1px solid rgba(94,235,255,.18);border-radius:16px;
      box-shadow:0 24px 70px rgba(0,0,0,.34),0 0 34px rgba(21,94,239,.12);
      padding:8px;z-index:80;max-height:420px;overflow:auto;
    }
    .search-results{left:0;right:auto;width:100%}
    .result-item,.notif-item{
      display:flex;gap:10px;align-items:flex-start;padding:10px;border-radius:11px;
      transition:.15s ease;cursor:pointer;
    }
    .result-item:hover,.notif-item:hover{background:rgba(47,107,255,.10)}
    .result-icon{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:rgba(47,107,255,.13);color:var(--cyan);flex:0 0 auto}
    .result-icon i{width:16px;height:16px}
    .result-text b{font-size:12px;display:block}.result-text span{font-size:11px;color:var(--muted)}
    .ai-button{
      height:42px;border-radius:13px;padding:0 15px;border:1px solid rgba(94,235,255,.28);
      color:#fff;background:linear-gradient(135deg,rgba(21,94,239,.95),rgba(124,92,255,.86));
      box-shadow:0 10px 28px rgba(21,94,239,.20);display:flex;align-items:center;gap:8px;
      font-weight:700;font-size:12px;
    }
    .ai-button i{width:17px;height:17px}
    .badge-dot{
      position:absolute;right:6px;top:5px;width:9px;height:9px;border-radius:50%;
      background:var(--danger);border:2px solid var(--bg);
    }
    .user-block{
      display:flex;align-items:center;gap:10px;padding:4px 2px 4px 6px;cursor:pointer;position:relative;
    }
    .avatar{
      width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-weight:800;font-size:12px;
      background:linear-gradient(145deg,var(--primary2),var(--purple));box-shadow:0 0 26px rgba(47,107,255,.22)
    }
    .user-meta b{font-size:12px;display:block}.user-meta span{font-size:10px;color:var(--muted)}
    .content{padding:24px;max-width:1800px;margin:0 auto}
    .page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:22px}
    .page-title h1{margin:0;font-size:28px;letter-spacing:-.035em}
    .page-title p{margin:7px 0 0;color:var(--muted);font-size:13px;max-width:780px;line-height:1.55}
    .page-actions{display:flex;gap:9px;flex-wrap:wrap}
    .btn{
      border-radius:12px;border:1px solid var(--line);padding:10px 14px;color:#fff;
      background:rgba(13,35,110,.52);display:inline-flex;align-items:center;justify-content:center;gap:8px;
      transition:.18s ease;font-weight:700;font-size:12px;
    }
    .btn:hover{transform:translateY(-1px);border-color:rgba(94,235,255,.38);box-shadow:0 10px 26px rgba(0,31,120,.18)}
    .btn i{width:16px;height:16px}
    .btn-primary{background:linear-gradient(135deg,var(--primary),var(--primary2));border-color:rgba(94,235,255,.24);box-shadow:0 8px 30px rgba(21,94,239,.22)}
    .btn-secondary{background:linear-gradient(135deg,rgba(124,92,255,.18),rgba(47,107,255,.18))}
    .btn-danger{background:rgba(251,113,133,.12);border-color:rgba(251,113,133,.24);color:#ffd5dd}
    .btn-ghost{background:transparent}
    .btn-sm{padding:7px 10px;border-radius:9px;font-size:11px}
    .grid{display:grid;gap:16px}
    .kpi-grid{grid-template-columns:repeat(5,minmax(0,1fr));margin-bottom:16px}
    .card{
      position:relative;overflow:hidden;border-radius:18px;border:1px solid var(--line);
      background:linear-gradient(145deg,rgba(7,24,95,.74),rgba(3,15,63,.80));
      box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.025);
    }
    .card::before{
      content:"";position:absolute;width:180px;height:180px;border-radius:50%;
      right:-95px;top:-105px;background:radial-gradient(circle,rgba(47,107,255,.13),transparent 70%);
      pointer-events:none;
    }
    .card-pad{padding:18px}
    .kpi{padding:17px}
    .kpi-top{display:flex;justify-content:space-between;align-items:center}
    .kpi-icon{
      width:38px;height:38px;border-radius:12px;display:grid;place-items:center;
      background:rgba(47,107,255,.12);border:1px solid rgba(94,235,255,.12);color:var(--cyan)
    }
    .kpi-icon i{width:18px;height:18px}
    .kpi-trend{font-size:10px;color:var(--success);display:flex;align-items:center;gap:4px}
    .kpi-value{font-size:26px;font-weight:850;margin-top:14px;letter-spacing:-.04em}
    .kpi-label{font-size:11px;color:var(--muted);margin-top:4px}
    .kpi.warn .kpi-icon{background:rgba(251,191,36,.11);color:var(--warning)}
    .kpi.danger .kpi-icon{background:rgba(251,113,133,.11);color:var(--danger)}
    .kpi.purple .kpi-icon{background:rgba(124,92,255,.12);color:#b7a6ff}
    .chart-grid{grid-template-columns:repeat(2,minmax(0,1fr));margin-bottom:16px}
    .chart-card{padding:18px;min-height:312px}
    .card-title{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:15px}
    .card-title h3{font-size:14px;margin:0}.card-title span{font-size:10px;color:var(--muted)}
    .chart-wrap{height:240px;position:relative}
    .dashboard-bottom{grid-template-columns:1.25fr .75fr}
    .insights{
      padding:18px;
      background:
        radial-gradient(circle at 90% 10%,rgba(94,235,255,.12),transparent 25%),
        linear-gradient(135deg,rgba(21,94,239,.18),rgba(124,92,255,.12));
      border-color:rgba(94,235,255,.26);
      box-shadow:0 0 0 1px rgba(94,235,255,.05),0 20px 70px rgba(21,94,239,.16);
    }
    .insights-head{display:flex;gap:12px;align-items:center;margin-bottom:16px}
    .spark{
      width:42px;height:42px;border-radius:13px;display:grid;place-items:center;
      background:linear-gradient(145deg,var(--primary2),var(--purple));box-shadow:0 0 24px rgba(94,235,255,.13)
    }
    .spark i{width:20px;height:20px}
    .insights-head h3{margin:0;font-size:15px}.insights-head p{margin:3px 0 0;color:var(--muted);font-size:11px}
    .insight-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
    .insight-item{padding:12px;border-radius:13px;background:rgba(2,11,58,.42);border:1px solid rgba(94,235,255,.10)}
    .insight-item b{font-size:19px;display:block}.insight-item span{font-size:10px;color:var(--muted)}
    .activity{padding:18px}
    .activity-row{display:flex;gap:11px;padding:11px 0;border-top:1px solid var(--line)}
    .activity-row:first-of-type{border-top:0}
    .activity-dot{width:9px;height:9px;border-radius:50%;margin-top:5px;background:var(--info);box-shadow:0 0 12px rgba(96,165,250,.5)}
    .activity-row b{font-size:11px;display:block}.activity-row span{font-size:10px;color:var(--muted)}
    .toolbar{
      display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px;margin-bottom:14px;
      border:1px solid var(--line);border-radius:15px;background:rgba(4,16,70,.50);
    }
    .field{
      height:40px;border:1px solid var(--line);border-radius:11px;background:rgba(2,12,55,.64);color:#fff;
      padding:0 12px;outline:none;min-width:160px;
    }
    .field:focus{border-color:rgba(94,235,255,.36);box-shadow:0 0 0 3px rgba(94,235,255,.05)}
    .toolbar .grow{flex:1;min-width:210px}
    .table-card{overflow:hidden}
    .table-scroll{overflow:auto}
    table{width:100%;border-collapse:collapse;min-width:900px}
    th{
      text-align:left;padding:12px 14px;font-size:10px;text-transform:uppercase;letter-spacing:.06em;
      color:#8aa9e8;background:rgba(2,12,55,.46);border-bottom:1px solid var(--line);white-space:nowrap;
    }
    td{padding:13px 14px;border-bottom:1px solid rgba(110,155,255,.10);font-size:11px;color:#d7e4ff;vertical-align:middle}
    tr:hover td{background:rgba(47,107,255,.045)}
    .table-link{font-weight:800;color:#8ec8ff;cursor:pointer}
    .table-link:hover{color:var(--cyan)}
    .badge{
      display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:5px 8px;
      font-size:10px;font-weight:800;border:1px solid transparent;white-space:nowrap;
    }
    .badge::before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor;box-shadow:0 0 8px currentColor}
    .badge-blue{background:rgba(59,130,246,.10);color:#8ec5ff;border-color:rgba(59,130,246,.18)}
    .badge-cyan{background:rgba(94,235,255,.09);color:#8ef4ff;border-color:rgba(94,235,255,.16)}
    .badge-green{background:rgba(52,211,153,.09);color:#75f0c1;border-color:rgba(52,211,153,.16)}
    .badge-yellow{background:rgba(251,191,36,.09);color:#fbd65f;border-color:rgba(251,191,36,.18)}
    .badge-red{background:rgba(251,113,133,.09);color:#ff9aab;border-color:rgba(251,113,133,.18)}
    .badge-purple{background:rgba(124,92,255,.10);color:#b8a8ff;border-color:rgba(124,92,255,.18)}
    .badge-gray{background:rgba(175,200,255,.08);color:#b7c9ef;border-color:rgba(175,200,255,.14)}
    .action-group{display:flex;gap:5px}
    .icon-mini{
      width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:rgba(7,24,95,.66);
      color:#b8ccf7;display:grid;place-items:center
    }
    .icon-mini:hover{color:#fff;border-color:rgba(94,235,255,.35);background:rgba(21,94,239,.18)}
    .icon-mini i{width:14px;height:14px}
    .ticket-detail-layout{grid-template-columns:minmax(0,1.35fr) minmax(360px,.65fr);align-items:start}
    .ticket-main,.ticket-ai{padding:18px}
    .ticket-meta{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 18px}
    .ticket-title{font-size:20px;margin:4px 0 0;line-height:1.4}
    .ticket-desc{font-size:12px;color:#c2d3f7;line-height:1.7}
    .meta-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:16px 0}
    .meta-box{border:1px solid var(--line);border-radius:12px;padding:11px;background:rgba(2,11,58,.33)}
    .meta-box span{font-size:9px;text-transform:uppercase;color:#7898d6;display:block}.meta-box b{font-size:11px;margin-top:5px;display:block}
    .timeline{margin-top:18px}
    .timeline-item{display:flex;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
    .timeline-item:first-child{border-top:0}
    .timeline-icon{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;background:rgba(47,107,255,.12);color:var(--cyan);flex:0 0 auto}
    .timeline-icon i{width:14px;height:14px}
    .timeline-item b{font-size:11px;display:block}.timeline-item p{font-size:10px;color:var(--muted);margin:3px 0 0;line-height:1.55}
    .ai-panel{
      border-color:rgba(94,235,255,.28);
      background:
        radial-gradient(circle at 90% 4%,rgba(124,92,255,.20),transparent 20%),
        linear-gradient(145deg,rgba(7,24,95,.94),rgba(3,15,68,.96));
      box-shadow:0 0 0 1px rgba(94,235,255,.05),0 22px 70px rgba(21,94,239,.18);
    }
    .ai-label{
      display:flex;align-items:center;gap:9px;font-weight:850;font-size:14px;margin-bottom:14px
    }
    .ai-label i{width:18px;color:var(--cyan)}
    .ai-class{
      padding:12px;border:1px solid rgba(94,235,255,.13);border-radius:13px;background:rgba(2,11,58,.42);margin-bottom:10px
    }
    .ai-class span{font-size:9px;color:#83a1dc;text-transform:uppercase;letter-spacing:.07em}.ai-class b{font-size:12px;display:block;margin-top:4px}
    .confidence{display:flex;align-items:center;gap:10px}
    .progress{
      height:7px;border-radius:99px;background:rgba(141,175,255,.12);overflow:hidden;flex:1;border:1px solid rgba(110,155,255,.08)
    }
    .progress > span{height:100%;display:block;border-radius:99px;background:linear-gradient(90deg,var(--primary2),var(--cyan));box-shadow:0 0 16px rgba(94,235,255,.30)}
    .ai-list{margin:10px 0 16px;padding:0;list-style:none}
    .ai-list li{font-size:11px;color:#c8d8fb;padding:6px 0;display:flex;gap:8px;align-items:flex-start}
    .ai-list li::before{content:"";width:6px;height:6px;border-radius:50%;margin-top:5px;flex:0 0 auto;background:var(--success);box-shadow:0 0 8px var(--success)}
    .rag-articles{display:grid;gap:8px;margin-bottom:14px}
    .rag-article{padding:10px;border-radius:11px;border:1px solid rgba(94,235,255,.10);background:rgba(2,11,58,.36);display:flex;gap:9px;align-items:center}
    .rag-article i{width:16px;color:var(--cyan)}.rag-article b{font-size:10px}.rag-article span{font-size:9px;color:var(--muted);display:block;margin-top:2px}
    .chat-layout{grid-template-columns:minmax(0,1fr) 310px;min-height:650px}
    .chat-card{display:flex;flex-direction:column;min-height:650px}
    .chat-head{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:11px}
    .chat-head .spark{width:36px;height:36px;border-radius:11px}.chat-head h3{margin:0;font-size:14px}.chat-head p{margin:2px 0 0;font-size:10px;color:var(--muted)}
    .chat-messages{flex:1;padding:20px;overflow:auto;display:flex;flex-direction:column;gap:14px}
    .message{max-width:78%;display:flex;gap:9px;align-items:flex-start}
    .message.user{margin-left:auto;flex-direction:row-reverse}
    .message-avatar{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;background:rgba(47,107,255,.14);border:1px solid var(--line);flex:0 0 auto}
    .message-avatar i{width:14px;height:14px;color:var(--cyan)}
    .bubble{
      padding:11px 13px;border-radius:14px;border:1px solid var(--line);background:rgba(7,24,95,.62);
      font-size:11px;line-height:1.65;color:#d9e6ff
    }
    .message.user .bubble{background:linear-gradient(135deg,rgba(21,94,239,.85),rgba(47,107,255,.62));border-color:rgba(94,235,255,.18)}
    .typing{display:flex;gap:4px;align-items:center}

      if(s.includes('sla')) return `<b>Riesgo SLA:</b><br>Prioridad inmediata para TKT-2026-00451 (21 min restantes) y TKT-2026-00452 (1h 12m). Sugiero escalar el primero al equipo de redes y mantener seguimiento cada 10 minutos.`;
      if(s.includes('log')) return `<b>Análisis preliminar:</b><br>El patrón “Database connection timeout” junto con uso de pool al 92% indica presión de conexiones. Revisa límites máximos, conexiones no liberadas y latencia de la base de datos.`;
      if(s.includes('soluci')) return `<b>Solución RAG recomendada:</b><br>1) Validar query plan e índices. 2) Medir pool activo/ocioso. 3) Aplicar timeout razonable. 4) Reintentar solo operaciones idempotentes. 5) Monitorear antes y después del cambio.`;
      return `He correlacionado tu consulta con el contexto ITSM disponible. Puedo profundizar en el ticket, servicio afectado, SLA, activo relacionado o base de conocimiento. Para un diagnóstico más preciso, comparte el código del ticket o pega los logs relevantes.`;
    }

            ${settingRow('Tema oscuro SaaS','Identidad visual tecnológica principal.','darkMode')}
          </div>
        </div>`;
      $$('.switch').forEach(sw=>sw.onclick=()=>sw.classList.toggle('on'));
      $('#saveSettings').onclick=()=>{$$('.switch').forEach(sw=>state.settings[sw.dataset.setting]=sw.classList.contains('on'));persist();toast('Configuración guardada','Las preferencias fueron actualizadas.')};
      if(window.lucide)lucide.createIcons();
    }
    function settingRow(title,sub,key){return `<div class="settings-row"><div><b>${title}</b><span>${sub}</span></div><button class="switch ${state.settings[key]?'on':''}" data-setting="${key}" aria-label="${title}"></button></div>`}

    function navigate(view){
      destroyCharts();
      currentView=view;selectedTicket=view==='tickets'?selectedTicket:null;
      $('#breadcrumbTitle').textContent=menu.find(m=>m[0]===view)?.[2]||'ServiceCloud AI';
      renderNav();
      const renderers={
        dashboard:renderDashboard,tickets:renderTickets,incidents:renderIncidents,sla:renderSLA,assignments:renderAssignments,
        knowledge:renderKnowledge,assistant:renderAssistant,logs:renderLogs,notifications:renderNotifications,reports:renderReports,settings:renderSettings
      };
      if(renderers[view])renderers[view]();else if(moduleMeta[view])renderGenericModule(view);else renderGenericModule('organizations');
      closeDrawer();
      window.scrollTo({top:0,behavior:'smooth'});
    }

    function openModal(title,body,footer=''){
      $('#modalTitle').textContent=title;$('#modalBody').innerHTML=body;$('#modalFooter').innerHTML=footer;$('#modalBackdrop').classList.add('open');
      if(window.lucide)lucide.createIcons();
    }
    function closeModal(){$('#modalBackdrop').classList.remove('open')}
    function openCrudModal(key,row=null){
      const meta=moduleMeta[key], editing=!!row;
      const body=`<form id="crudForm" class="form-grid">${meta.fields.map(([name,label,type,opts])=>formField(name,label,type,row?.[name]??'',opts)).join('')}</form>`;
      openModal(`${editing?'Editar':'Nuevo'} · ${meta.title}`,body,`<button class="btn btn-secondary" id="cancelModal">Cancelar</button><button class="btn btn-primary" id="saveCrud">${icon('save')} Guardar</button>`);
      $('#cancelModal').onclick=closeModal;
      $('#saveCrud').onclick=()=>{
        const data=Object.fromEntries(new FormData($('#crudForm')).entries());
        meta.fields.forEach(([name,,type])=>{if(type==='number')data[name]=Number(data[name]||0)});
        if(editing)Object.assign(row,data);else state[key].unshift({id:uid(key.slice(0,3).toUpperCase()),...data});
        persist();closeModal();renderGenericModule(key);toast(editing?'Registro actualizado':'Registro creado',`${meta.title}: cambios guardados correctamente.`);
      };
    }
    function formField(name,label,type,value,opts){
      if(type==='select')return `<div class="form-group"><label>${label}</label><select class="form-control" name="${name}">${opts.map(o=>`<option ${String(value)===o?'selected':''}>${o}</option>`).join('')}</select></div>`;
      return `<div class="form-group"><label>${label}</label><input class="form-control" name="${name}" type="${type}" value="${escapeHTML(value)}" required /></div>`;
    }
    function openCrudView(key,row){
      const meta=moduleMeta[key];
      openModal(`${meta.title} · ${row.id}`,`<div class="form-grid">${meta.fields.map(([name,label])=>`<div class="meta-box"><span>${label}</span><b>${escapeHTML(row[name]??'—')}</b></div>`).join('')}</div>`,
        `<button class="btn btn-secondary" id="closeView">Cerrar</button><button class="btn btn-primary" id="editFromView">${icon('pencil')} Editar</button>`);
      $('#closeView').onclick=closeModal;$('#editFromView').onclick=()=>openCrudModal(key,row);
    }
    function confirmDelete(key,row){
      openModal('Confirmar eliminación',`<p class="ticket-desc">¿Deseas eliminar <b>${escapeHTML(row.id)}</b>? Esta acción se simula en localStorage y puede revertirse recargando los datos iniciales.</p>`,
        `<button class="btn btn-secondary" id="cancelDelete">Cancelar</button><button class="btn btn-danger" id="confirmDelete">${icon('trash-2')} Eliminar</button>`);
      $('#cancelDelete').onclick=closeModal;$('#confirmDelete').onclick=()=>{state[key]=state[key].filter(x=>x.id!==row.id);persist();closeModal();renderGenericModule(key);toast('Registro eliminado',`${row.id} fue eliminado.`)};
    }
    function openTicketModal(ticket=null,prefill={}){
      const t=ticket||prefill||{};
      const body=`<form id="ticketForm" class="form-grid">
        ${formField('title','Título','text',t.title||'')}
        ${formField('org','Organización','text',t.org||'AndesMarket S.A.C.')}
        ${formField('priority','Prioridad','select',t.priority||'Media',['Baja','Media','Alta','Crítica'])}
        ${formField('status','Estado','select',t.status||'Abierto',['Abierto','En progreso','En espera','Resuelto'])}
        ${formField('tech','Técnico','text',t.tech||'Sin asignar')}
        ${formField('service','Servicio','text',t.service||'ERP Corporativo')}
        ${formField('category','Categoría','text',t.category||'Aplicaciones')}
        ${formField('sla','SLA','text',t.sla||'03h 59m')}
      </form>`;
      openModal(ticket?'Editar ticket':'Nuevo ticket',body,`<button class="btn btn-secondary" id="cancelModal">Cancelar</button><button class="btn btn-primary" id="saveTicket">${icon('save')} Guardar</button>`);
      $('#cancelModal').onclick=closeModal;
      $('#saveTicket').onclick=()=>{
        const d=Object.fromEntries(new FormData($('#ticketForm')).entries());
        if(ticket)Object.assign(ticket,d);
        else state.tickets.unshift({id:`TKT-2026-${String(453+state.tickets.length).padStart(5,'0')}`,...d,date:nowLabel()});
        persist();closeModal();selectedTicket=null;navigate('tickets');toast(ticket?'Ticket actualizado':'Ticket creado','Los cambios fueron guardados en este navegador.');
      };
    }
    function openIncidentModal(){
      openModal('Nueva incidencia',`<form id="incidentForm" class="form-grid">
        ${formField('description','Descripción','text','')}
        ${formField('service','Servicio','text','ERP Corporativo')}
        ${formField('impact','Impacto','select','Medio',['Alto','Medio','Bajo'])}
        ${formField('urgency','Urgencia','select','Media',['Alta','Media','Baja'])}
        ${formField('priority','Prioridad','select','Alta',['Crítica','Alta','Media','Baja'])}
        ${formField('owner','Responsable','text','Equipo de Soporte')}
        ${formField('status','Estado','select','Investigando',['Investigando','En progreso','Monitoreando','Resuelto'])}
      </form>`,`<button class="btn btn-secondary" id="cancelModal">Cancelar</button><button class="btn btn-primary" id="saveIncident">${icon('save')} Guardar</button>`);
      $('#cancelModal').onclick=closeModal;$('#saveIncident').onclick=()=>{const d=Object.fromEntries(new FormData($('#incidentForm')).entries());state.incidents.unshift({id:uid('INC'),...d});persist();closeModal();renderIncidents();toast('Incidencia creada','El nuevo registro se agregó correctamente.')};
    }
    function openArticleModal(){
      openModal('Nuevo artículo',`<form id="articleForm" class="form-grid">
        ${formField('title','Título','text','')}
        ${formField('category','Categoría','select','Aplicaciones',['Redes','Aplicaciones','Bases de datos','Seguridad','Cloud','Hardware'])}
        <div class="form-group full"><label>Resumen</label><textarea class="form-control" name="summary" required></textarea></div>
      </form>`,`<button class="btn btn-secondary" id="cancelModal">Cancelar</button><button class="btn btn-primary" id="saveArticle">${icon('save')} Publicar</button>`);
      $('#cancelModal').onclick=closeModal;$('#saveArticle').onclick=()=>{const d=Object.fromEntries(new FormData($('#articleForm')).entries());state.knowledge.unshift({id:uid('KB'),...d,views:0,updated:'Ahora'});persist();closeModal();renderKnowledge();toast('Artículo publicado','La base RAG se actualizará con el nuevo contenido.')};
    }
    function openSimpleNoteModal(t){
      openModal('Agregar nota al ticket',`<div class="form-group"><label>Nota interna</label><textarea class="form-control" id="ticketNote" placeholder="Describe el avance, evidencia o siguiente acción..."></textarea></div>`,
        `<button class="btn btn-secondary" id="cancelModal">Cancelar</button><button class="btn btn-primary" id="saveNote">${icon('message-square-plus')} Agregar nota</button>`);
      $('#cancelModal').onclick=closeModal;$('#saveNote').onclick=()=>{closeModal();toast('Nota agregada',`Se añadió una nota interna a ${t.id}.`)};
    }
    function openInfoModal(title,text,save=false){
      openModal(title,`<p class="ticket-desc">${text}</p>`,`${save?`<button class="btn btn-primary" id="infoSave">${icon('save')} Guardar simulación</button>`:`<button class="btn btn-secondary" id="infoClose">Cerrar</button>`}`);
      (save?$('#infoSave'):$('#infoClose')).onclick=()=>{closeModal();if(save)toast('Guardado','La configuración simulada se registró correctamente.')};
    }

    function toast(title,text){
      const el=document.createElement('div');el.className='toast';el.innerHTML=`<div class="toast-icon">${icon('check')}</div><div><b>${escapeHTML(title)}</b><p>${escapeHTML(text||'')}</p></div>`;
      $('#toastStack').appendChild(el);if(window.lucide)lucide.createIcons();setTimeout(()=>el.remove(),3400);
    }
    function exportCSV(name,rows){
      if(!rows?.length)return;
      const headers=[...new Set(rows.flatMap(r=>Object.keys(r)))];
      const csv=[headers.join(','),...rows.map(r=>headers.map(h=>`"${String(r[h]??'').replace(/"/g,'""')}"`).join(','))].join('\n');
      const blob=new Blob(["\ufeff"+csv],{type:'text/csv;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');
      a.href=url;a.download=`servicecloud_${name}_${new Date().toISOString().slice(0,10)}.csv`;a.click();URL.revokeObjectURL(url);
    }

    function renderNotificationDropdown(){
      $('#notifDropdown').innerHTML=`<div class="profile-drop-head"><b>Notificaciones</b><span>${state.notifications.filter(n=>n.unread).length} sin leer</span></div>`+
      state.notifications.slice(0,5).map(n=>`<div class="notif-item ${n.unread?'unread':''}" data-notif-id="${n.id}"><div class="notif-dot" style="${n.unread?'':'opacity:.2'}"></div><div class="result-text"><b>${escapeHTML(n.title)}</b><span>${escapeHTML(n.text)} · ${escapeHTML(n.time)}</span></div></div>`).join('')+
      `<button class="drop-action" data-route="notifications">${icon('list')} Ver todas las notificaciones</button>`;
      if(window.lucide)lucide.createIcons();
    }
    function renderProfileDropdown(){
      $('#profileDropdown').innerHTML=`<div class="profile-drop-head"><b>Jorge Espinoza</b><span>Administrador SaaS</span></div>
        <button class="drop-action" data-route="settings">${icon('settings')} Configuración</button>
        <button class="drop-action" id="resetDemo">${icon('rotate-ccw')} Restaurar datos demo</button>
        <button class="drop-action" id="logoutDemo">${icon('log-out')} Cerrar sesión (demo)</button>`;
      $('#resetDemo').onclick=()=>{state=clone(defaults);persist();toast('Datos restaurados','Se cargaron nuevamente los datos de demostración.');navigate('dashboard')};
      $('#logoutDemo').onclick=()=>toast('Modo demostración','No existe una sesión real porque esta aplicación funciona sin backend.');
      if(window.lucide)lucide.createIcons();
    }

    function handleGlobalSearch(){
      const q=$('#globalSearch').value.trim().toLowerCase(), box=$('#searchResults');
      if(q.length<2){box.classList.add('hidden');return}
      const results=[];
      state.tickets.filter(x=>Object.values(x).join(' ').toLowerCase().includes(q)).slice(0,4).forEach(x=>results.push({type:'Ticket',title:x.id,sub:x.title,route:'tickets',id:x.id,ic:'ticket-check'}));
      state.users.filter(x=>Object.values(x).join(' ').toLowerCase().includes(q)).slice(0,3).forEach(x=>results.push({type:'Usuario',title:x.name,sub:x.email,route:'users',ic:'user'}));
      state.assets.filter(x=>Object.values(x).join(' ').toLowerCase().includes(q)).slice(0,3).forEach(x=>results.push({type:'Activo',title:x.name,sub:`${x.type} · ${x.org}`,route:'assets',ic:'monitor'}));
      box.innerHTML=results.length?results.slice(0,8).map((r,idx)=>`<div class="result-item" data-search-index="${idx}"><div class="result-icon">${icon(r.ic)}</div><div class="result-text"><b>${escapeHTML(r.title)}</b><span>${escapeHTML(r.type)} · ${escapeHTML(r.sub)}</span></div></div>`).join(''):emptyState('Sin resultados','No encontramos coincidencias.');
      box.classList.remove('hidden');
      $$('.result-item',box).forEach((el,idx)=>el.onclick=()=>{const r=results[idx];box.classList.add('hidden');$('#globalSearch').value='';if(r.id){selectedTicket=r.id}navigate(r.route)});
      if(window.lucide)lucide.createIcons();
    }

    function toggleSidebar(){
      if(window.innerWidth<=1024){document.body.classList.toggle('sidebar-open')}
      else{document.body.classList.toggle('sidebar-collapsed')}
      const ic=$('#menuToggle i');if(ic)ic.setAttribute('data-lucide',document.body.classList.contains('sidebar-collapsed')?'panel-left-open':'panel-left-close');if(window.lucide)lucide.createIcons();
    }
    function closeDrawer(){document.body.classList.remove('sidebar-open')}

    document.addEventListener('click',e=>{
      const route=e.target.closest('[data-route]');if(route){navigate(route.dataset.route);return}
      const ticket=e.target.closest('[data-ticket]');if(ticket){selectedTicket=ticket.dataset.ticket;navigate('tickets');return}
      const v=e.target.closest('[data-crud-view]');if(v){const row=state[v.dataset.crudView].find(x=>x.id===v.dataset.id);if(row)openCrudView(v.dataset.crudView,row);return}
      const ed=e.target.closest('[data-crud-edit]');if(ed){const row=state[ed.dataset.crudEdit].find(x=>x.id===ed.dataset.id);if(row)openCrudModal(ed.dataset.crudEdit,row);return}
      const del=e.target.closest('[data-crud-delete]');if(del){const row=state[del.dataset.crudDelete].find(x=>x.id===del.dataset.id);if(row)confirmDelete(del.dataset.crudDelete,row);return}
      const nw=e.target.closest('[data-crud-new]');if(nw){openCrudModal(nw.dataset.crudNew);return}
      const art=e.target.closest('[data-article]');if(art){const a=state.knowledge.find(x=>x.id===art.dataset.article);if(a)openInfoModal(a.title,`${a.summary}<br><br>Categoría: <b>${a.category}</b> · ${a.views} vistas · ${a.updated}`);return}
      if(!e.target.closest('.search-wrap'))$('#searchResults').classList.add('hidden');
      if(!e.target.closest('#notifBtn')&&!e.target.closest('#notifDropdown'))$('#notifDropdown').classList.add('hidden');
      if(!e.target.closest('#profileBtn')&&!e.target.closest('#profileDropdown'))$('#profileDropdown').classList.add('hidden');
    });

    $('#menuToggle').onclick=toggleSidebar;
    $('#mobileOverlay').onclick=closeDrawer;
    $('#openAI').onclick=()=>navigate('assistant');
    $('#globalSearch').addEventListener('input',handleGlobalSearch);
    $('#notifBtn').onclick=e=>{e.stopPropagation();renderNotificationDropdown();$('#profileDropdown').classList.add('hidden');$('#notifDropdown').classList.toggle('hidden')};
    $('#profileBtn').onclick=e=>{e.stopPropagation();renderProfileDropdown();$('#notifDropdown').classList.add('hidden');$('#profileDropdown').classList.toggle('hidden')};
    $('#modalClose').onclick=closeModal;$('#modalBackdrop').addEventListener('click',e=>{if(e.target===$('#modalBackdrop'))closeModal()});
    window.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();$('#notifDropdown').classList.add('hidden');$('#profileDropdown').classList.add('hidden')}});

    renderNav();
    navigate('dashboard');
  })();
  </script>
</body>
</html>
